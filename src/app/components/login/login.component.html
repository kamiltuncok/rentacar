<div class="auth-page">
  <div class="auth-card">

    <div class="auth-card__logo">
      <a routerLink="/" class="auth-brand-link">
        <svg class="auth-brand-logo" width="40" height="40" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="OtoGez Logo">
          <rect width="48" height="48" rx="12" fill="#F97316"/>
          <g fill="none" stroke="#111827" stroke-width="3">
            <circle cx="22" cy="22" r="12"/>
            <ellipse cx="22" cy="22" rx="5" ry="12"/>
            <path d="M10 22h24"/>
          </g>
          <path d="M25 25l19 7-8 3 4 8-4 2-4-8-6 5z" fill="#FFFFFF" stroke="#111827" stroke-width="2.5" stroke-linejoin="round"/>
        </svg>
        <span class="auth-brand-name">Oto<span class="auth-brand-accent">Gez</span></span>
      </a>
    </div>

    <!-- Bireysel / Kurumsal tab switcher -->
    <div class="auth-tab-group">
      <a class="auth-tab" [routerLink]="['/login']" [class.active]="isActive('/login')">Bireysel</a>
      <a class="auth-tab" [routerLink]="['/loginforcorporate']" [class.active]="isActive('/loginforcorporate')">Kurumsal</a>
    </div>

    <h1 class="auth-card__title">Giriş Yap</h1>

    <form [formGroup]="loginForm">
      <div class="auth-field">
        <label for="loginEmail">E-POSTA</label>
        <input id="loginEmail" formControlName="email" type="email" placeholder="ornek@email.com">
      </div>

      <div class="auth-field">
        <label for="loginPassword">ŞİFRE</label>
        <input id="loginPassword" formControlName="password" type="password" placeholder="••••••••">
      </div>

      <button class="auth-submit" type="submit" (click)="login()">Giriş Yap</button>
    </form>

    <div class="auth-footer">
      Hesabınız yok mu? <a routerLink="/register">Kayıt Ol</a>
    </div>

  </div>
</div>
