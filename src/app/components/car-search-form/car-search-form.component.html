<!-- OtoGez Hero + Search Section -->
<div class="og-hero" [class.og-hero--popup]="showCloseButton">
  <button *ngIf="showCloseButton" class="og-hero__close" (click)="onClose()" aria-label="Kapat">&#10005;</button>

  <div class="og-hero__inner">
    <!-- Glassmorphic Search Card -->
    <div class="og-search-card">
      <div class="og-search-card__header">
        <h1 class="og-search-card__title">
          Kolay Kiralama,<br><span class="og-search-card__title-accent">Her Yere.</span>
        </h1>
        <p class="og-search-card__subtitle">Mükemmel aracınızı bulun ve hemen yola çıkın</p>
      </div>

      <!-- Individual / Corporate Tabs -->
      <div class="og-search-tabs">
        <button type="button" class="og-search-tab" (click)="setCustomerType('individual')"
          [class.og-search-tab--active]="customerType === 'individual'">
          Bireysel
        </button>
        <button type="button" class="og-search-tab" (click)="setCustomerType('corporate')"
          [class.og-search-tab--active]="customerType === 'corporate'">
          Kurumsal
        </button>
      </div>

      <div class="og-search-body">
        <!-- Pickup Office -->
        <div class="og-search-field">
          <label class="og-search-label">ALIŞ NOKTASI</label>
          <input type="text" class="og-search-input" [(ngModel)]="selectedStartLocation"
            placeholder="Şehir veya ofis seçiniz..." [attr.list]="alisOfisiId"
            (change)="setStartLocation(selectedStartLocation)">
          <datalist [id]="alisOfisiId">
            <option *ngFor="let option of alisOfisiOptions" [value]="option.locationName"></option>
          </datalist>
        </div>

        <!-- Dates Row -->
        <div class="og-search-dates-row">
          <div class="og-search-field">
            <label class="og-search-label">ALIŞ</label>
            <div class="og-search-datetime-group">
              <input type="date" class="og-search-input og-search-input--date" [(ngModel)]="selectedStartDate">
              <input type="time" class="og-search-input og-search-input--time" [(ngModel)]="selectedStartTime">
            </div>
          </div>

          <div class="og-search-field">
            <label class="og-search-label">İADE</label>
            <div class="og-search-datetime-group">
              <input type="date" class="og-search-input og-search-input--date" [(ngModel)]="selectedEndDate">
              <input type="time" class="og-search-input og-search-input--time" [(ngModel)]="selectedEndTime">
            </div>
          </div>
        </div>

        <div class="og-search-duration-badge" *ngIf="dayCount > 0">
          <span>Toplam kiralama: <strong>{{ dayCount }} gün</strong></span>
        </div>

        <!-- Different return office checkbox -->
        <label class="og-search-checkbox">
          <input type="checkbox" (click)="toggleReturnOfficeVisibility($event)">
          <span>Araç farklı bir ofiste teslim edilecek</span>
        </label>

        <!-- Return Office (conditional) -->
        <div class="og-search-field" *ngIf="isDifferentReturnOffice">
          <label class="og-search-label">İADE ETME OFİSİ</label>
          <input type="text" class="og-search-input" [(ngModel)]="selectedEndLocation" placeholder="İade ofisi seçiniz..."
            [attr.list]="iadeOfisiId">
          <datalist [id]="iadeOfisiId">
            <option *ngFor="let option of iadeOfisiOptions" [value]="option.locationName"></option>
          </datalist>
        </div>

        <!-- Submit Button -->
        <button type="button" class="og-search-btn" (click)="onSearch()">ARAÇ ARA</button>
      </div>
    </div>

    <!-- Hero Art (desktop) -->
    <div class="og-hero__art" *ngIf="!showCloseButton" aria-hidden="true">
      <img src="assets/hero-car.png" alt="OtoGez Araç Kiralama" class="og-hero__art-img">
    </div>
  </div>
</div>
